<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="1030" cy="80" r="180" fill="url(#glow)"/>
  <circle cx="120" cy="250" r="140" fill="url(#glow)"/>

  <!-- decorative circuit lines -->
  <g stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 0 260 L 90 260 L 110 240 L 220 240"/>
    <path d="M 0 220 L 60 220 L 80 200 L 160 200"/>
    <circle cx="220" cy="240" r="4" fill="#a78bfa" fill-opacity="0.5"/>
    <circle cx="160" cy="200" r="4" fill="#818cf8" fill-opacity="0.5"/>
  </g>
  <g stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 1200 60 L 1110 60 L 1090 80 L 1000 80"/>
    <path d="M 1200 110 L 1140 110 L 1120 130 L 1050 130"/>
    <circle cx="1000" cy="80" r="4" fill="#60a5fa" fill-opacity="0.5"/>
    <circle cx="1050" cy="130" r="4" fill="#818cf8" fill-opacity="0.5"/>
  </g>

  <!-- name -->
  <text x="600" y="140" font-family="'Segoe UI', Verdana, sans-serif" font-size="56" font-weight="700" fill="url(#nameGrad)" text-anchor="middle">
    Manmadh Gonela
  </text>

  <!-- role line -->
  <text x="600" y="185" font-family="'Segoe UI', Verdana, sans-serif" font-size="19" font-weight="400" fill="#e5e7eb" text-anchor="middle" letter-spacing="0.5">
    ML Engineer &#8226; DevOps Engineer &#8226; MLOps Engineer &#8226; MERN Stack Developer
  </text>

  <!-- tagline -->
  <text x="600" y="220" font-family="'Fira Code', monospace" font-size="15" fill="#a78bfa" text-anchor="middle">
    Building intelligent solutions that make a difference
  </text>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Verdana, sans-serif" font-size="13" font-weight="600">
    <rect x="410" y="245" width="65" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="442" y="262" fill="#e5e7eb" text-anchor="middle">Python</text>

    <rect x="485" y="245" width="55" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="512" y="262" fill="#e5e7eb" text-anchor="middle">Java</text>

    <rect x="550" y="245" width="55" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="577" y="262" fill="#e5e7eb" text-anchor="middle">MERN</text>

    <rect x="615" y="245" width="55" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="642" y="262" fill="#e5e7eb" text-anchor="middle">AWS</text>

    <rect x="680" y="245" width="70" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="715" y="262" fill="#e5e7eb" text-anchor="middle">Docker</text>
  </g>
</svg>
